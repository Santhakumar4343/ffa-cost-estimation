# Included in every location (nginx drops server-level add_header when a location adds its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Scripts: own origin only. Styles: inline style attributes are used by React. Fonts: Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Enable HSTS only once the site is served over HTTPS (e.g. behind a TLS load balancer):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
